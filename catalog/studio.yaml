{
  "schema": "studio.catalog/v2",
  "suite": {
    "id": "studio",
    "version": "2.0.0",
    "protocol_version": "2.0.0",
    "display_name": "Studio"
  },
  "repository": {
    "url": "https://github.com/Zodiac411/open-software-studio",
    "default_branch": "master"
  },
  "license": {
    "spdx": "MIT",
    "holder": "Open Software Studio"
  },
  "icon_system": {
    "source": "brand/icon-system/icon-grid.svg",
    "motif": "opal-seed",
    "sizes": [32, 48, 64, 128, 256, 512],
    "safe_inset": 0.14,
    "palette": {
      "paper": "#F7F0E6",
      "porcelain": "#EEE4D4",
      "graphite": "#28323A",
      "opal": "#DDE8E4",
      "gold": "#C89D5B",
      "cyan": "#74B9C9",
      "rose": "#D99C89",
      "amber": "#D9B36C",
      "sage": "#86A88F",
      "sky": "#7EAED2",
      "teal": "#5E9F9C"
    },
    "roles": {
      "studio-delivery": { "glyph": "orbit", "accent": "opal" },
      "project-architect": { "glyph": "compass", "accent": "gold" },
      "interface-studio": { "glyph": "planes", "accent": "rose" },
      "research-engineer": { "glyph": "lens", "accent": "cyan" },
      "project-docs": { "glyph": "leaf", "accent": "amber" },
      "engineering-guard": { "glyph": "aperture", "accent": "sage" },
      "web-app-builder": { "glyph": "blocks", "accent": "sky" },
      "execution-guard": { "glyph": "halo", "accent": "teal" },
      "studio-track": { "glyph": "path", "accent": "gold" }
    }
  },
  "profiles": {
    "lite": {
      "max_active_wps": 1,
      "max_subsystems": 1,
      "artifacts": ["PROJECT_INDEX", "PROJECT_BRIEF", "WORK_PACKAGE", "IMPLEMENTATION_HANDOFF", "INDEPENDENT_REVIEW"]
    },
    "standard": {
      "max_active_wps": 2,
      "max_subsystems": 2,
      "artifacts": ["PROJECT_INDEX", "PROJECT_BRIEF", "PRODUCT_SPEC", "DOMAIN_MODEL", "ARCHITECTURE", "DELIVERY_PLAN", "VERIFICATION_CONTRACT", "WORK_PACKAGE", "CONTEXT_CAPSULE", "IMPLEMENTATION_HANDOFF", "INDEPENDENT_REVIEW", "EVIDENCE_RECEIPT"]
    },
    "full": {
      "max_active_wps": 2,
      "max_subsystems": 4,
      "artifacts": ["PROJECT_INDEX", "PROJECT_BRIEF", "PRODUCT_SPEC", "CHANGE_PROPOSAL", "RESEARCH_DECISION_MEMO", "SOURCE_LEDGER", "DOMAIN_MODEL", "ARCHITECTURE", "EXPERIENCE_SPEC", "DELIVERY_PLAN", "VERIFICATION_CONTRACT", "WORK_PACKAGE", "CONTEXT_CAPSULE", "IMPLEMENTATION_HANDOFF", "INDEPENDENT_REVIEW", "REPAIR_PACKAGE", "EVIDENCE_RECEIPT", "MILESTONE_RECEIPT", "RELEASE_RECEIPT", "RETRO_DISTILLATION"]
    }
  },
  "archetypes": ["auto", "software", "plugin", "web", "game", "integration", "mcp-app"],
  "evidence_levels": ["E0", "E1", "E2", "E3", "E4", "E5"],
  "result_states": ["PASS", "PASS_WITH_LIMITATIONS", "BLOCKED", "NOT_RUN", "UNPROVEN"],
  "artifact_templates": {
    "PROJECT_INDEX": { "required_fields": ["document_id", "project_id", "title", "authority", "status", "version", "owner", "approved_by", "applies_to", "snapshot", "last_verified", "next_review_trigger"], "sections": ["Project in one paragraph", "Authority map", "Read-by-task routes", "Current phase", "Immediate next action", "Recovery path"] },
    "CURRENT_STATE": { "required_fields": ["document_id", "project_id", "phase", "status", "active_wp", "current_sha", "next_action", "blocking_items", "proof", "last_event", "recovery_files"], "sections": ["Current phase", "Active work package", "Current revision", "Proof and limitations", "Blocking items", "Recovery files", "Next action"] },
    "PROJECT_BRIEF": { "required_fields": ["document_id", "project_id", "primary_outcome", "target_actor", "desired_outcome", "constraints", "non_goals", "assumptions", "parked_ideas", "solution_ladder", "disposition"], "sections": ["Problem and current limitation", "Target actor", "Desired outcome", "Success signals", "Constraints", "Primary outcome", "Non-goals", "Assumptions", "Parked ideas", "Smallest adequate solution", "Decision"] },
    "PRODUCT_SPEC": { "required_fields": ["document_id", "project_id", "requirements", "scenarios", "acceptance", "non_goals", "proof_level"], "sections": ["Outcome", "Actors and scenarios", "Functional requirements", "Non-functional requirements", "Acceptance", "Proof plan", "Non-goals"] },
    "CHANGE_PROPOSAL": { "required_fields": ["document_id", "change_id", "reason", "current_decision", "proposed_decision", "impact", "approval", "rollback"], "sections": ["Reason", "Current decision", "Proposed change", "Impact", "Approval", "Rollback"] },
    "RESEARCH_DECISION_MEMO": { "required_fields": ["document_id", "claims", "decision", "trade_offs", "confidence", "refresh_trigger"], "sections": ["Decision question", "Material claims", "Options", "Decision", "Trade-offs", "Confidence", "Refresh trigger"] },
    "SOURCE_LEDGER": { "required_fields": ["document_id", "claims", "source", "retrieved", "freshness", "license", "strength", "affected_decision"], "sections": ["Claim ledger", "Source quality", "Freshness", "License and attribution", "Decision links"] },
    "DOMAIN_MODEL": { "required_fields": ["document_id", "entities", "relationships", "invariants", "ownership", "unknowns"], "sections": ["Entities", "Relationships", "Invariants", "Ownership", "Unknowns"] },
    "ARCHITECTURE": { "required_fields": ["document_id", "verified_current_architecture", "boundaries", "quality_attributes", "options", "chosen_architecture", "failure_recovery", "security", "dependencies", "rollback", "revisit_triggers"], "sections": ["Verified current architecture", "Ownership boundaries", "Quality attributes", "Options considered", "Chosen architecture", "Data and control flow", "Failure and recovery", "Security and trust boundaries", "Dependency policy", "Migration and rollback", "ADR index", "Revisit triggers"] },
    "ADR": { "required_fields": ["document_id", "decision", "status", "context", "options", "consequences", "evidence", "revisit_trigger"], "sections": ["Context", "Decision", "Options", "Consequences", "Evidence", "Revisit trigger"] },
    "EXPERIENCE_SPEC": { "required_fields": ["document_id", "actor", "flow", "states", "components", "responsive", "accessibility", "fallback", "visual_qa"], "sections": ["Actor and job", "Task flow", "Surface map", "State matrix", "Component map", "Interaction rules", "Responsive composition", "Accessibility acceptance", "Dreamfield material budget", "Fallbacks", "Visual QA"] },
    "DELIVERY_PLAN": { "required_fields": ["document_id", "work_packages", "dependencies", "requirements", "scope_budget", "review_gate"], "sections": ["Dependency graph", "Work package table", "Scope budget", "Review gate"] },
    "VERIFICATION_CONTRACT": { "required_fields": ["document_id", "requirements", "proof_levels", "commands", "runtime_probes", "failure_policy", "rollback"], "sections": ["Requirement-to-proof map", "Commands", "Runtime probes", "Failure policy", "Rollback"] },
    "WORK_PACKAGE": { "required_fields": ["document_id", "wp_id", "status", "snapshot_id", "base_sha", "primary_outcome", "requirements", "allowed_paths", "forbidden_paths", "scope_budget", "acceptance", "verification", "non_goals", "stop_conditions", "rollback", "handoff_requirements"], "sections": ["Primary outcome", "Value slice", "Proof slice", "Requirements", "Assumptions and constraints", "Allowed paths", "Forbidden paths", "Solution ladder", "Scope budget", "Acceptance and verification", "Non-goals", "Stop and replan conditions", "Rollback", "Handoff"] },
    "CONTEXT_CAPSULE": { "required_fields": ["document_id", "wp_id", "snapshot_id", "active_goal", "requirements", "decisions", "scope_budget", "allowed_paths", "forbidden_paths", "acceptance", "proof", "stop_conditions"], "sections": ["Active goal", "Relevant requirements", "Relevant decisions", "Scope budget", "Allowed and forbidden paths", "Acceptance", "Proof", "Stop conditions"] },
    "IMPLEMENTATION_HANDOFF": { "required_fields": ["document_id", "wp_id", "base_sha", "head_sha", "branch", "claimed_outcomes", "files", "commands", "evidence", "scope_delta", "unproven", "next_action", "reviewer_action"], "sections": ["Baseline and head", "Claimed outcomes", "Files and diff", "Observed verification", "Evidence levels", "Scope delta", "Failures and unproven boundaries", "Residual risks", "Rollback", "Requested reviewer action"] },
    "INDEPENDENT_REVIEW": { "required_fields": ["document_id", "review_id", "reviewer_role", "reviewer_context", "reviewed_head_sha", "wp_id", "requirements", "independent_checks", "scope_delta", "findings", "disposition", "conditions"], "sections": ["Independence", "Reviewed state", "Requirement coverage", "Independent checks", "Findings", "Disposition", "Acceptance conditions"] },
    "REPAIR_PACKAGE": { "required_fields": ["document_id", "repair_id", "accepted_findings", "allowed_paths", "forbidden_paths", "required_behavior", "regression_proof", "evidence", "non_goals", "repair_budget", "stop_conditions"], "sections": ["Accepted findings", "Allowed and forbidden scope", "Required behavior", "Regression proof", "Evidence", "Non-goals", "Stop conditions"] },
    "EVIDENCE_RECEIPT": { "required_fields": ["document_id", "evidence_id", "requirement", "level", "command_or_probe", "observed", "timestamp", "limitations"], "sections": ["Requirement", "Evidence level", "Command or probe", "Observed result", "Limitations"] },
    "MILESTONE_RECEIPT": { "required_fields": ["document_id", "milestone_id", "revision", "work_packages", "evidence", "remaining_risk", "owner_approval"], "sections": ["Outcome", "Accepted work", "Evidence", "Remaining risk", "Owner approval"] },
    "RELEASE_RECEIPT": { "required_fields": ["document_id", "version", "revision", "environment", "evidence", "limitations", "waivers", "rollback", "owner_approval"], "sections": ["Revision", "Environment", "Evidence", "Known limitations", "Waivers", "Rollback", "Owner approval"] },
    "RETRO_DISTILLATION": { "required_fields": ["document_id", "outcomes", "friction", "measured_evidence", "decisions", "next_actions"], "sections": ["Outcomes", "Friction", "Measured evidence", "Decisions", "Next actions"] }
  },
  "generated_skills": [
    { "id": "studio-start", "description": "Start a Studio project by selecting a proportional profile, archetype, authorities, and next valid phase.", "role": "front-door", "focus": "project intake, profile selection, repository and Drive identity, and next-action routing", "outputs": ["PROJECT_INDEX", "PROJECT_BRIEF"], "never_owns": "implementation or acceptance" },
    { "id": "studio-shape", "description": "Shape an ambiguous product or repository request into a decision-ready scope and smallest adequate solution.", "role": "front-door", "focus": "problem framing, assumptions, constraints, solution ladder, scope budget, and disposition", "outputs": ["PROJECT_BRIEF", "CHANGE_PROPOSAL"], "never_owns": "premature implementation" },
    { "id": "studio-plan", "description": "Plan approved Studio work by linking requirements, decisions, proof, dependencies, and bounded work packages.", "role": "front-door", "focus": "requirements, architecture, UX, verification, plan critique, and snapshot readiness", "outputs": ["PRODUCT_SPEC", "ARCHITECTURE", "DELIVERY_PLAN", "VERIFICATION_CONTRACT", "WORK_PACKAGE"], "never_owns": "code execution or self-acceptance" },
    { "id": "studio-design", "description": "Route experience decisions through flows, states, accessibility, responsive behavior, and Dreamfield visual QA.", "role": "front-door", "focus": "UX, interaction, accessibility, responsive composition, and visual evidence", "outputs": ["EXPERIENCE_SPEC"], "never_owns": "repository implementation" },
    { "id": "studio-research", "description": "Research only decision-changing external evidence and record source quality, freshness, license, and confidence.", "role": "front-door", "focus": "primary sources, repository health, current APIs, trade-offs, and refresh triggers", "outputs": ["RESEARCH_DECISION_MEMO", "SOURCE_LEDGER"], "never_owns": "unsupported claims or implementation" },
    { "id": "studio-docs", "description": "Compile the smallest coherent Studio artifact pack and machine sidecars from approved structured state.", "role": "front-door", "focus": "template selection, traceability, authority, supersession, and durable document output", "outputs": ["PROJECT_INDEX", "CURRENT_STATE", "EVIDENCE_RECEIPT"], "never_owns": "competing manual source of truth" },
    { "id": "studio-work", "description": "Route an approved work package through context, implementation, proof, repair, closeout, or release preparation.", "role": "front-door", "focus": "active work package, context capsule, bounded execution, proof, and closeout", "outputs": ["CONTEXT_CAPSULE", "IMPLEMENTATION_HANDOFF", "REPAIR_PACKAGE"], "never_owns": "merge or independent acceptance" },
    { "id": "studio-build", "description": "Implement one approved repository work package with reuse-first scope, required safety, and direct verification.", "role": "front-door", "focus": "repository evidence, allowed paths, smallest safe change, tests, and handoff", "outputs": ["IMPLEMENTATION_HANDOFF", "EVIDENCE_RECEIPT"], "never_owns": "planning authority or review acceptance" },
    { "id": "studio-verify", "description": "Verify mechanics, evidence levels, freshness, scope, and rollback without converting weak evidence into a pass.", "role": "front-door", "focus": "deterministic validators, evidence grading, seeded gates, and honest limitations", "outputs": ["VERIFICATION_CONTRACT", "EVIDENCE_RECEIPT"], "never_owns": "self-acceptance" },
    { "id": "studio-review", "description": "Independently review the current SHA, requirements, diff, CI, runtime evidence, and scope delta in a fresh context.", "role": "front-door", "focus": "independent findings, review disposition, repair acceptance, and stale-state detection", "outputs": ["INDEPENDENT_REVIEW", "REPAIR_PACKAGE"], "never_owns": "the work it accepts" },
    { "id": "studio-status", "description": "Report canonical project state, drift, blockers, proof, and exactly one next valid action.", "role": "front-door", "focus": "reconcile .project state, GitHub projections, Drive authorities, and current SHA", "outputs": ["CURRENT_STATE"], "never_owns": "silent mutation" },
    { "id": "studio-track", "description": "Project approved Studio work packages into GitHub Issues and Milestones while keeping .project state authoritative.", "role": "front-door", "focus": "idempotent issue and milestone projection, dependencies, stale reviews, and drift", "outputs": ["MILESTONE_RECEIPT", "WORK_PACKAGE"], "never_owns": "a second task authority" },
    { "id": "studio-release", "description": "Qualify a Studio release by checking accepted work, revision, proof, compatibility, rollback, and owner approval.", "role": "front-door", "focus": "release gates, version alignment, migration, target-host evidence, and rollback", "outputs": ["RELEASE_RECEIPT"], "never_owns": "publishing or owner approval" },
    { "id": "studio-improve", "description": "Distil verified project learnings into bounded improvements without smuggling optional work into current acceptance.", "role": "front-door", "focus": "retro evidence, friction, decisions, and separately scoped improvements", "outputs": ["RETRO_DISTILLATION", "CHANGE_PROPOSAL"], "never_owns": "unapproved scope expansion" },
    { "id": "studio-doctor", "description": "Diagnose Studio catalog, package, schema, state, tool, and permission readiness without modifying user work.", "role": "front-door", "focus": "read-only health checks, actionable blockers, and fail-open behavior", "outputs": ["EVIDENCE_RECEIPT"], "never_owns": "automatic repair or permission escalation" },
    { "id": "studio-init", "description": "Initialize an idempotent Studio .project control plane with file-backed active plan, findings, and progress state.", "role": "front-door", "focus": "safe project initialization and recovery files", "outputs": ["PROJECT_INDEX", "CURRENT_STATE"], "never_owns": "overwriting existing project state" },
    { "id": "studio-context", "description": "Compile a compact work-package context capsule from current requirements, decisions, scope, proof, and stop conditions.", "role": "front-door", "focus": "selective context, authority boundaries, and fresh-session recovery", "outputs": ["CONTEXT_CAPSULE"], "never_owns": "full-history injection" },
    { "id": "studio-evidence", "description": "Grade and validate named evidence against requirement proof levels, freshness, and current repository state.", "role": "front-door", "focus": "E0 through E5 evidence receipts, direct observations, and unproven boundaries", "outputs": ["EVIDENCE_RECEIPT"], "never_owns": "unsupported completion claims" },
    { "id": "studio-handoff", "description": "Compile a fact-first implementation handoff from the current branch, SHA, diff, checks, evidence, and scope delta.", "role": "front-door", "focus": "handoff claim package and reviewer action", "outputs": ["IMPLEMENTATION_HANDOFF"], "never_owns": "review disposition" },
    { "id": "studio-repair", "description": "Execute only an accepted bounded repair package and emit fresh evidence for independent re-review.", "role": "front-door", "focus": "accepted findings, allowed paths, regression proof, and stop conditions", "outputs": ["REPAIR_PACKAGE", "IMPLEMENTATION_HANDOFF"], "never_owns": "optional finding promotion" },
    { "id": "studio-close", "description": "Close an implementation session by persisting progress, evidence, handoff, blockers, and the next reviewer action.", "role": "front-door", "focus": "file-backed recovery, clean closeout, and no self-acceptance", "outputs": ["IMPLEMENTATION_HANDOFF", "EVIDENCE_RECEIPT", "RETRO_DISTILLATION"], "never_owns": "merge or release" },
    { "id": "studio-scope-guard", "description": "Apply the necessity, reuse, native, dependency, and minimum ladder before adding Studio scope.", "role": "lens", "focus": "scope budget, reuse ledger, overshoot audit, safety exemptions, and replan triggers", "outputs": ["PROJECT_BRIEF", "WORK_PACKAGE"], "never_owns": "removing security, accessibility, validation, or error handling" },
    { "id": "studio-ambiguity-audit", "description": "Find ambiguous nouns, verbs, actors, boundaries, and success statements before they harden into requirements.", "role": "lens", "focus": "observable language, missing decisions, and clarify-or-stop questions", "outputs": ["PROJECT_BRIEF", "PRODUCT_SPEC"], "never_owns": "inventing product decisions" },
    { "id": "studio-assumption-map", "description": "Extract and rank assumptions by uncertainty, impact, owner, evidence, and cheapest useful test.", "role": "lens", "focus": "load-bearing assumptions and validation order", "outputs": ["PROJECT_BRIEF", "RESEARCH_DECISION_MEMO"], "never_owns": "presenting assumptions as facts" },
    { "id": "studio-constraint-audit", "description": "Identify technical, legal, platform, accessibility, security, budget, and delivery constraints with evidence.", "role": "lens", "focus": "hard constraints, soft preferences, conflicts, and missing authority", "outputs": ["PROJECT_BRIEF", "VERIFICATION_CONTRACT"], "never_owns": "weakening a required safeguard" },
    { "id": "studio-requirement-quality", "description": "Check requirements for observable behavior, ownership, priority, scenario, acceptance, proof, and traceability.", "role": "lens", "focus": "testable requirement wording and conflict/gap detection", "outputs": ["PRODUCT_SPEC", "VERIFICATION_CONTRACT"], "never_owns": "adding unrequested features" },
    { "id": "studio-acceptance-writer", "description": "Turn approved outcomes into precise acceptance criteria with direct commands, probes, and evidence levels.", "role": "lens", "focus": "observable acceptance and proof contract", "outputs": ["PRODUCT_SPEC", "VERIFICATION_CONTRACT", "WORK_PACKAGE"], "never_owns": "claiming a result before observation" },
    { "id": "studio-edge-case-audit", "description": "Elicit relevant failure, boundary, accessibility, concurrency, migration, and recovery cases for a bounded change.", "role": "lens", "focus": "critical edge cases proportional to risk", "outputs": ["VERIFICATION_CONTRACT", "WORK_PACKAGE"], "never_owns": "inventing a test matrix without a requirement" },
    { "id": "studio-premortem", "description": "Run a focused pre-mortem for a high-risk plan and connect likely failures to signals, prevention, and fallback.", "role": "lens", "focus": "early failure signals and recovery", "outputs": ["ARCHITECTURE", "DELIVERY_PLAN"], "never_owns": "expanding the project because of hypotheticals" },
    { "id": "studio-strategy-red-team", "description": "Challenge load-bearing assumptions, hidden coupling, false proof, scope gaming, and authority conflicts.", "role": "lens", "focus": "adversarial plan and review critique", "outputs": ["INDEPENDENT_REVIEW", "CHANGE_PROPOSAL"], "never_owns": "quietly redesigning the approved plan" },
    { "id": "studio-option-tradeoff", "description": "Compare bounded options by outcome fit, evidence, risk, cost, reversibility, and maintenance burden.", "role": "lens", "focus": "decision trace and explicit trade-offs", "outputs": ["RESEARCH_DECISION_MEMO", "ARCHITECTURE"], "never_owns": "unbounded option generation" },
    { "id": "studio-domain-model", "description": "Model the minimum entities, relationships, invariants, ownership, and unknowns needed for the next decision.", "role": "lens", "focus": "domain boundaries and durable vocabulary", "outputs": ["DOMAIN_MODEL"], "never_owns": "premature database or subsystem design" },
    { "id": "studio-architecture-review", "description": "Review architecture boundaries, quality attributes, dependencies, trust edges, failure recovery, and revisit triggers.", "role": "lens", "focus": "evidence-led architecture fitness and risk", "outputs": ["ARCHITECTURE", "INDEPENDENT_REVIEW"], "never_owns": "implementation acceptance" },
    { "id": "studio-issue-plan", "description": "Compile one reviewable Studio work package into an idempotent GitHub issue projection with dependencies and proof.", "role": "lens", "focus": "issue-ready scope, labels, dependencies, and drift detection", "outputs": ["WORK_PACKAGE", "MILESTONE_RECEIPT"], "never_owns": "making GitHub a second authority" },
    { "id": "studio-artifact-lint", "description": "Lint Studio artifacts for IDs, authority, links, required fields, scope, proof, freshness, and unsupported claims.", "role": "lens", "focus": "deterministic artifact and template integrity", "outputs": ["EVIDENCE_RECEIPT", "INDEPENDENT_REVIEW"], "never_owns": "silently filling missing facts" }
  ],
